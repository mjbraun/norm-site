<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Norm — Thanks</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./colors_and_type.css">
<link rel="icon" href="./assets/logo-mark.svg">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px; }
  .card { max-width: 480px; text-align: center; }
  .mark { display: block; height: 36px; margin: 0 auto 32px; }
  .eyebrow { font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-subtle); margin-bottom: 16px; }
  h1 { font-family: var(--font-display); font-weight: 400; font-size: 48px; line-height: 1.1; letter-spacing: -0.02em; color: var(--ink-400); margin: 0 0 16px; text-wrap: balance; font-variation-settings: "opsz" 48; }
  p { font-size: 17px; line-height: 1.6; color: var(--ink-100); margin: 0 0 24px; }
  a { color: var(--sage-400); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; text-decoration-color: color-mix(in oklab, var(--sage-400) 40%, transparent); }
  a:hover { color: var(--sage-500); text-decoration-color: var(--sage-500); }
  .home { font-size: 14px; }
</style>
</head>
<body>
  <div class="card">
    <img class="mark" src="./assets/logo-wordmark.svg" alt="Norm">
    <div class="eyebrow">Thanks</div>
    <h1>Got it — we'll be in touch.</h1>
    <p>We typically respond within a week. If you have anything to add in the meantime, email <a href="mailto:hello@norm.fi">hello@norm.fi</a>.</p>
    <p class="home"><a href="/">Back to home</a></p>
  </div>
</body>
</html>
